version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: socialflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socialflow_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-socialflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialflow_dev_password_change_in_prod}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - socialflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialflow_user} -d ${POSTGRES_DB:-socialflow_ai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - socialflow_network

  redis:
    image: redis:7-alpine
    container_name: socialflow_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - socialflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - socialflow_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialflow_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_NAME=SocialFlow AI
      - APP_ENV=development
      - DEBUG=true
      - API_V1_PREFIX=/api/v1
      - DATABASE_URL=postgresql://socialflow_user:socialflow_dev_password_change_in_prod@postgres:5432/socialflow_ai_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change_me_super_secret_signing_key_min_32_characters_for_socialflow
      - ENCRYPTION_KEY=gx7Nso52XxQ_J9Lpk-Wp3d7BjGk6xxLKBikiyabOFd4=
      - CORS_ORIGINS=["*"]
      - LOCAL_MEDIA_DIR=/app/uploads
      - MAX_UPLOAD_SIZE_MB=25
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - ./backend:/app
      - socialflow_uploads:/app/uploads
    networks:
      - socialflow_network

volumes:
  socialflow_pgdata:
  socialflow_redisdata:
  socialflow_uploads:

networks:
  socialflow_network:
    driver: bridge

