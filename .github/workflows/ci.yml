name: SocialFlow AI CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  flutter-test:
    name: Flutter Admin Quality & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flutter_admin

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  backend-test:
    name: Backend API & Pytest Suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migration check
        run: |
          export DATABASE_URL="sqlite:///ci_test.db"
          alembic -c alembic.ini upgrade head

      - name: Run Pytest test suite
        run: pytest tests/

